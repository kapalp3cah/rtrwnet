{% load static %}
<!-- ===== HEADER - BRZ AZURE GOLD THEME ===== -->
<nav class="navbar navbar-expand-lg navbar-brz">
    <div class="container">
        <!-- Brand -->
        <a class="navbar-brand" href="{% url 'home' %}">
            <i class="bi bi-router-fill"></i>
            BRZ WIFI
        </a>
        
        <!-- Toggler untuk mobile -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarMain" 
                aria-controls="navbarMain" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        
        <!-- Navbar Links -->
        <div class="collapse navbar-collapse" id="navbarMain">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link nav-link-brz {% if request.path == '/' %}active{% endif %}" href="{% url 'home' %}">
                        <i class="bi bi-house-door-fill"></i> Home
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-brz {% if '/pricing' in request.path %}active{% endif %}" href="{% url 'pricing' %}">
                        <i class="bi bi-tags-fill"></i> Paket
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-brz {% if '/pelanggan' in request.path %}active{% endif %}" href="{% url 'pelanggan' %}">
                        <i class="bi bi-people-fill"></i> Pelanggan
                    </a>
                </li>
                {% if user.is_staff %}
                <li class="nav-item">
                    <a class="nav-link nav-link-brz" href="{% url 'import_radboox' %}">
                        <i class="bi bi-file-spreadsheet-fill"></i> Import
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link nav-link-brz" href="/admin/">
                        <i class="bi bi-speedometer2"></i> Admin
                    </a>
                </li>
                {% endif %}
            </ul>
            
            <!-- User Section -->
            <div class="d-flex align-items-center gap-2 flex-wrap">
                {% if user.is_authenticated %}
                    <span class="user-welcome">
                        <i class="bi bi-person-circle"></i>
                        {{ user.username }}
                    </span>
                    
                    <!-- Form logout dengan POST -->
                    <form method="post" action="{% url 'logout' %}" style="display: inline;" id="logoutForm">
                        {% csrf_token %}
                        <button type="submit" class="btn-logout-customer">
                            <i class="bi bi-box-arrow-right"></i>
                            Logout
                        </button>
                    </form>
                {% else %}
                    <a href="{% url 'login' %}" class="btn-login-customer">
                        <i class="bi bi-box-arrow-in-right"></i>
                        Login
                    </a>
                {% endif %}
                
                <!-- WhatsApp Button -->
                <a href="https://wa.me/6282312290956" target="_blank" class="btn-wa-header">
                    <i class="bi bi-whatsapp"></i>
                    <span class="d-none d-lg-inline">Admin</span>
                </a>
            </div>
        </div>
    </div>
</nav>
